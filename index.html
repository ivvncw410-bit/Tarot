<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>星語塔羅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. Setup panel -> deck shuffle -> pick grid -> flipped spread -> written reading. A second tab holds the 22-card guide. */
:root{
  --bg:#ECEAF4; --surface:#F7F6FB; --surface2:#E3E0EF; --ink:#1C1936; --muted:#5B5776;
  --line:#CBC6DD; --accent:#74540F; --btn-bg:#2A2457; --btn-fg:#F4EFDD; --glow:rgba(116,84,15,.10);
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --sans:"Noto Sans TC","PingFang HK","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif;
  --disp:"Cinzel","Noto Serif TC",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13112A; --surface:#1D1A3B; --surface2:#27235A; --ink:#ECE8F7; --muted:#A29EC0;
    --line:#383266; --accent:#E2BD5C; --btn-bg:#E2BD5C; --btn-fg:#1A1533; --glow:rgba(226,189,92,.10);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13112A; --surface:#1D1A3B; --surface2:#27235A; --ink:#ECE8F7; --muted:#A29EC0;
  --line:#383266; --accent:#E2BD5C; --btn-bg:#E2BD5C; --btn-fg:#1A1533; --glow:rgba(226,189,92,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.75; font-size:15px;
  padding-block:22px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 40% at 50% 0%,var(--glow),transparent 70%);
  background-repeat:no-repeat;
}
.wrap{max-width:720px;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.35}

/* header */
.eyebrow{font:500 11px var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-size:34px;font-weight:700;letter-spacing:.12em}
.lead{color:var(--muted);margin:8px 0 0;max-width:34em}
.tabs{display:flex;gap:6px;margin:22px 0 20px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.field{display:grid;gap:8px;margin-bottom:18px}
.field>label,.field>legend{font-weight:700;font-size:14px;padding:0}
fieldset.field{border:0;margin:0 0 18px;padding:0;min-width:0}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;min-height:72px}
textarea::placeholder{color:var(--muted);opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font-size:14px}
.chip input:checked+span{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:46px;padding:0 24px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:700;letter-spacing:.2em}
.btn:disabled{opacity:.65;cursor:default}
.btn.ghost{background:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}

/* cards */
.card{position:relative;aspect-ratio:120/200;width:100%}
.face{position:absolute;inset:0;border-radius:6%/3.6%;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 2px 8px rgba(10,6,30,.35)}
.face svg{display:block;width:100%;height:100%}
.fc{background:linear-gradient(165deg,hsl(var(--h) 42% 30%),hsl(var(--h) 50% 13%))}
.cb{background:linear-gradient(160deg,#2D2766,#15113A)}
.face .fr1{fill:none;stroke:#E6C874;stroke-width:1.4}
.face .fr2{fill:none;stroke:#E6C874;stroke-width:.6;opacity:.7}
.face .num{font:700 11px var(--disp);fill:#F3E9CF;letter-spacing:.12em}
.face .zh{font:700 14px var(--serif);fill:#F6EDD2;letter-spacing:.2em}
.face .en{font:500 6px var(--disp);fill:#E6C874;letter-spacing:.14em}
.face .sep{stroke:#E6C874;stroke-width:.6;opacity:.7;fill:none}
.ln{fill:none;stroke:#E6C874;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ln .f{fill:rgba(230,200,116,.26)}
.ln .g{fill:#E6C874;stroke:#E6C874}
.ln .w{fill:#F3E9CF;stroke:#F3E9CF}
.ln .k{fill:#171231;stroke:#E6C874}

/* deck + shuffle */
.deckwrap{display:grid;justify-items:center;gap:6px;margin:4px 0 16px}
.deck{position:relative;width:92px;aspect-ratio:120/200;margin-block:6px}
.dc{position:absolute;inset:0;border-radius:6%/3.6%;overflow:hidden;box-shadow:0 1px 4px rgba(10,6,30,.4);transform:translate(calc(var(--k)*-.9px),calc(var(--k)*-1.5px))}
.dc svg{display:block;width:100%;height:100%}
.shuffling .dc:nth-child(odd){animation:rl .45s ease-in-out infinite alternate;animation-delay:calc(var(--k)*30ms)}
.shuffling .dc:nth-child(even){animation:rr .45s ease-in-out infinite alternate;animation-delay:calc(var(--k)*30ms)}
@keyframes rl{from{transform:translate(0,0) rotate(0)}to{transform:translate(-54px,-8px) rotate(-10deg)}}
@keyframes rr{from{transform:translate(0,0) rotate(0)}to{transform:translate(54px,-8px) rotate(10deg)}}
.hint{color:var(--muted);text-align:center;margin:0}
.summary-line{font-size:13px;color:var(--muted);text-align:center;margin:0 0 4px}
.qecho{font:700 18px var(--serif);text-align:center;margin:0 0 4px;text-wrap:balance}

/* pick grid */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:9px;margin:16px 0}
.pick{position:relative;padding:0;border:0;background:none;cursor:pointer;aspect-ratio:120/200;border-radius:6%/3.6%;transition:transform .15s;animation:deal .4s both;animation-delay:calc(var(--k)*26ms)}
.pick:hover{transform:translateY(-4px)}
.pick .face{box-shadow:0 1px 4px rgba(10,6,30,.4)}
.pick[aria-pressed="true"]{transform:none;cursor:default}
.pick[aria-pressed="true"] .face{opacity:.3}
.pick .badge{position:absolute;inset:0;display:none;place-items:center;font:700 22px var(--disp);color:var(--accent)}
.pick[aria-pressed="true"] .badge{display:grid}
@keyframes deal{from{opacity:0;transform:translateY(-18px) scale(.85)}to{opacity:1;transform:none}}
.count{font:700 15px var(--serif);text-align:center;margin:0}

/* spread */
.spread{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 12px;margin:18px 0}
.slot{width:calc((100% - 24px)/3);display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.spread.one .slot{width:min(54%,200px)}
.slot .pos{font-size:12px;color:var(--muted);text-align:center;line-height:1.4}
.slot .pos b{display:block;color:var(--accent);font-size:13px;letter-spacing:.1em}
.flipbtn{width:100%;padding:0;border:0;background:none;cursor:pointer;perspective:900px;border-radius:6%/3.6%}
.flip{position:relative;aspect-ratio:120/200;width:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.flip.on{transform:rotateY(180deg)}
.flip .front{transform:rotateY(180deg)}
.flip .front.rev{transform:rotateY(180deg) rotate(180deg)}
.nm{min-height:3em;text-align:center;font:700 15px var(--serif);line-height:1.3}
.nm small{display:block;font:400 12px var(--sans);color:var(--muted);margin-top:2px}

/* reading */
.reading{margin-top:12px}
.rd{display:grid;gap:8px;padding:20px 0;border-top:1px solid var(--line)}
.rd .pos{font-size:12px;color:var(--accent);letter-spacing:.1em;font-weight:700}
.rd .pos em{font-style:normal;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:8px}
.rd h3{font-size:21px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rd h3 .en{font:500 12px var(--disp);letter-spacing:.12em;color:var(--muted)}
.tag{font:700 11px var(--sans);padding:1px 8px;border-radius:6px;border:1px solid var(--accent);color:var(--accent)}
.tag.rev{background:var(--accent);color:var(--bg)}
.kw{margin:0;color:var(--muted);font-size:13px}
.rd p{margin:0}
.tl{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:14px}
.tl b{color:var(--accent);margin-right:8px}
.sum{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;background:var(--surface);padding:20px 18px;display:grid;gap:12px;margin-top:6px}
.sum h2{font-size:26px;letter-spacing:.1em}
.sum .lab{font:500 11px var(--disp);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin:0}
.sum p{margin:0}
.meter{display:grid;gap:4px}
.track{position:relative;height:4px;border-radius:2px;background:var(--line)}
.track i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--accent)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.advice{border-left:3px solid var(--accent);padding-left:12px}
.note{font-size:12.5px;color:var(--muted)}

/* gallery */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 10px}
.g{padding:0;border:0;background:none;cursor:pointer;display:grid;gap:6px;justify-items:center;text-align:center;font-size:12px;color:var(--muted)}
.g .card{border-radius:6%/3.6%;transition:transform .15s}
.g:hover .card{transform:translateY(-3px)}
.g[aria-current="true"]{color:var(--ink);font-weight:700}
.g[aria-current="true"] .card{outline:2px solid var(--accent);outline-offset:3px}
.detail{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:22px;margin-bottom:26px;align-items:start}
.detail h2{font-size:28px;letter-spacing:.1em}
.detail .art{font-size:14px;color:var(--muted);margin:10px 0 14px}
.detail .art b{color:var(--ink);margin-right:8px}
.two{display:grid;gap:14px}
.two section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.two h4{font-size:16px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.two h4 span{font:400 12px var(--sans);color:var(--muted)}
.two p{margin:6px 0 0;font-size:14px}
.dtopic{margin:12px 0 4px}
@media (max-width:560px){.detail{grid-template-columns:1fr;justify-items:center}.detail .dt-card{width:150px}.detail .dt-body{width:100%}}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Tarot · Major Arcana</p>
    <h1>星語塔羅</h1>
    <p class="lead">靜下心問一個問題，洗牌、憑直覺抽牌、親手翻開，再看牌面為你映照出什麼。</p>
  </header>

  <div class="tabs" role="tablist" aria-label="功能">
    <button class="tab" role="tab" id="tab-read" aria-selected="true" aria-controls="view-read">占卜</button>
    <button class="tab" role="tab" id="tab-gal" aria-selected="false" aria-controls="view-gal">牌義圖鑑</button>
  </div>

  <main>
    <section id="view-read" role="tabpanel" aria-labelledby="tab-read">
      <!-- setup -->
      <div id="setup" class="panel">
        <div class="field">
          <label for="q">你想問什麼？</label>
          <textarea id="q" rows="2" maxlength="120" placeholder="例如：今年轉工會順利嗎？（可留空，心裡默想亦可）"></textarea>
        </div>
        <fieldset class="field">
          <legend>問題類別</legend>
          <div class="chips">
            <label class="chip"><input type="radio" name="topic" value="all" checked><span>綜合</span></label>
            <label class="chip"><input type="radio" name="topic" value="love"><span>感情</span></label>
            <label class="chip"><input type="radio" name="topic" value="work"><span>事業</span></label>
            <label class="chip"><input type="radio" name="topic" value="money"><span>財運</span></label>
          </div>
        </fieldset>
        <fieldset class="field">
          <legend>牌陣</legend>
          <div class="chips">
            <label class="chip"><input type="radio" name="sp" value="one"><span>單張・每日指引</span></label>
            <label class="chip"><input type="radio" name="sp" value="three" checked><span>三張・過去現在未來</span></label>
            <label class="chip"><input type="radio" name="sp" value="five"><span>五張・處境挑戰建議</span></label>
          </div>
        </fieldset>
        <div class="deckwrap">
          <div class="deck" id="deck" aria-hidden="true"></div>
          <p class="hint" id="deckHint">按下洗牌前，先在心裡默想你的問題。</p>
        </div>
        <div class="actions"><button class="btn primary" id="shuffleBtn" type="button">洗牌</button></div>
      </div>

      <!-- pick -->
      <div id="pickStage" hidden>
        <p class="qecho" id="echoQ1"></p>
        <p class="summary-line" id="echoMeta1"></p>
        <p class="hint" aria-live="polite" id="pickHint"></p>
        <div class="pickgrid" id="pickgrid"></div>
        <p class="count" id="count" aria-live="polite"></p>
        <div class="actions" style="margin-top:12px">
          <button class="btn" id="autoBtn" type="button">替我抽牌</button>
          <button class="btn ghost" id="backBtn" type="button">重新設定</button>
        </div>
      </div>

      <!-- reveal -->
      <div id="revealStage" hidden>
        <p class="qecho" id="echoQ2"></p>
        <p class="summary-line" id="echoMeta2"></p>
        <p class="hint" aria-live="polite" id="revealHint">逐張點擊牌背翻開，或一次全部翻開。</p>
        <div class="spread" id="spread"></div>
        <div class="actions"><button class="btn" id="flipAllBtn" type="button">全部翻開</button></div>
      </div>

      <div id="reading" class="reading" hidden></div>
    </section>

    <section id="view-gal" role="tabpanel" aria-labelledby="tab-gal" hidden>
      <div class="detail" id="detail"></div>
      <h2 style="font-size:18px;margin-bottom:14px">22 張大阿爾克那</h2>
      <div class="gal-grid" id="galgrid"></div>
    </section>
  </main>

  <footer>
    <p class="note">塔羅是反思與娛樂的工具，沒有科學證據證明能預測未來。牌面不能取代專業意見，健康、法律與財務上的重要決定，請諮詢相關專業人士。圖案為簡化的原創線稿，傳統牌面的細節更為豐富。</p>
  </footer>
</div>

<script>
(function(){

/* ---------- drawing helpers ---------- */
var F=function(n){return Math.round(n*10)/10};

/* ---------- utilities ---------- */
var $=function(s){return document.querySelector(s)};
var rnd=function(n){
  if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
  return Math.floor(Math.random()*n)
};
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=rnd(i+1),t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}

}

/* ---------- flow ---------- */
function startShuffle(){
  if(S.busy)return;S.busy=true;
  S.q=$('#q').value.trim();
  S.topic=document.querySelector('input[name=topic]:checked').value;
  S.sp=document.querySelector('input[name=sp]:checked').value;
  S.deck=shuffle(Array.apply(null,{length:22}).map(function(_,i){return i}));
  $('#deck').classList.add('shuffling');
  var b=$('#shuffleBtn');b.disabled=true;b.textContent='洗牌中…';
  $('#deckHint').textContent='專心想著你的問題⋯⋯';
  later(function(){$('#deck').classList.remove('shuffling');enterPick()},1900);
}
function enterPick(){
  S.picks=[];S.flipped=0;
  $('#setup').hidden=true;$('#reading').hidden=true;$('#revealStage').hidden=true;

  $('#pickgrid').innerHTML=h;

  scrollTo($('#pickStage'));
}

function pick(k){
  var n=SPREADS[S.sp].n;
  if(S.picks.length>=n)return;
  var btn=document.querySelector('.pick[data-k="'+k+'"]');
  if(!btn||btn.getAttribute('aria-pressed')==='true')return;
  S.picks.push({ci:S.deck[k],rev:rnd(2)===1});
  btn.setAttribute('aria-pressed','true');
  btn.setAttribute('aria-label','第 '+(k+1)+' 張牌，已選為第 '+S.picks.length+' 張');
  btn.querySelector('.badge').textContent=S.picks.length;
  updateCount();
  if(S.picks.length===n){S.busy=true;later(enterReveal,700)}
}
function autoPick(){
  var n=SPREADS[S.sp].n,free=[];
  document.querySelectorAll('.pick[aria-pressed="false"]').forEach(function(b){free.push(+b.dataset.k)});
  shuffle(free);
  var need=n-S.picks.length;
  free.slice(0,need).forEach(function(k,i){later(function(){pick(k)},i*220)});
}
function enterReveal(){
  $('#pickStage').hidden=true;$('#revealStage').hidden=false;
  echo();
  var sp=SPREADS[S.sp],h='';
  S.picks.forEach(function(p,i){
    h+='<div class="slot"><div class="pos"><b>'+sp.pos[i][0]+'</b>'+sp.pos[i][1]+'</div>'
     +'<button class="flipbtn" type="button" data-i="'+i+'" aria-label="翻開'+sp.pos[i][0]+'牌">'
     +'<div class="flip">'+back()+face(p.ci,p.rev?' rev front':' front')+'</div></button>'
     +'<div class="nm" id="nm'+i+'"></div></div>';
  });
  var sEl=$('#spread');sEl.className='spread'+(sp.n===1?' one':'');sEl.innerHTML=h;
  $('#flipAllBtn').hidden=false;
  $('#revealHint').textContent='逐張點擊牌背翻開，或一次全部翻開。';
  scrollTo($('#revealStage'));
}
function flip(i){
  var btn=document.querySelector('.flipbtn[data-i="'+i+'"]');
  if(!btn)return;
  var f=btn.querySelector('.flip');
  if(f.classList.contains('on'))return;
  f.classList.add('on');
  var p=S.picks[i],c=CARDS[p.ci];
  btn.setAttribute('aria-label',c.zh+'，'+(p.rev?'逆位':'正位'));
  $('#nm'+i).innerHTML=c.zh+'<small>'+(p.rev?'逆位':'正位')+' · '+c.en+'</small>';
  S.flipped++;
  if(S.flipped===S.picks.length){$('#flipAllBtn').hidden=true;$('#revealHint').textContent='牌已全部翻開。';later(showReading,1000)}
}
function flipAll(){
  var n=S.picks.length,t=0;
  for(var i=0;i<n;i++){(function(i){var f=document.querySelector('.flipbtn[data-i="'+i+'"] .flip');if(f&&!f.classList.contains('on')){later(function(){flip(i)},t);t+=380}})(i)}
}

/* ---------- reading ---------- */
function score(p){var s=CARDS[p.ci].s;return p.rev?(s>0?-s*0.6:(s<0?-s*0.4:-0.3)):s}
function tagName(p){return '「'+CARDS[p.ci].zh+(p.rev?'・逆位':'')+'」'}
var VERDICTS=[
 [1.5,"順風順水","牌面整體偏向積極，時機與能量都站在你這邊。放手去做，但仍要落實細節。"],
 [0.5,"穩中向好","整體趨勢正面，雖然未必一步登天，持續努力會見到成果。"],
 [-0.4,"平穩觀望","牌面起伏不大，不好不壞。重點在於你如何回應，宜先觀察再行動。"],
 [-1.2,"略有阻滯","牌面顯示有些阻力或需要調整的地方。放慢一點，把問題看清楚便能化解。"],
 [-99,"先穩陣腳","牌面反映壓力與變動較大。這不代表結局注定不好，而是提醒你先保護好自己，再逐步重整。"]
];
function showReading(){
  var sp=SPREADS[S.sp],P=S.picks;
  var items=P.map(function(p,i){
    var c=CARDS[p.ci],r=p.rev?1:0;
    var tl=S.topic==='all'?'':'<p class="tl"><b>'+TOPICS[S.topic]+'</b>'+c[S.topic][r]+'</p>';
    return '<article class="rd"><div class="pos">'+sp.pos[i][0]+'<em>'+sp.pos[i][1]+'</em></div>'
      +'<h3>'+c.zh+'<span class="en">'+c.en+'</span><span class="tag'+(r?' rev':'')+'">'+(r?'逆位':'正位')+'</span></h3>'
      +'<p class="kw">'+c.kw[r]+'</p><p>'+(r?c.r:c.u)+'</p>'+tl+'</article>';
  }).join('');

  var total=0;P.forEach(function(p){total+=score(p)});
  var avg=total/P.length,v=VERDICTS[VERDICTS.length-1];
  for(var i=0;i<VERDICTS.length;i++){if(avg>=VERDICTS[i][0]){v=VERDICTS[i];break}}
  var pct=Math.max(0,Math.min(1,(avg+2)/5))*100;

  var story='';
  if(S.sp==='three'){
    var d=score(P[2])-score(P[0]);
    var base='牌面由'+tagName(P[0])+'走到'+tagName(P[1])+'，而未來指向'+tagName(P[2])+'。';
    story=base+(d>=1?'整體走勢向上，情況會逐步改善。':(d<=-1?'走勢轉緊，建議及早準備與調整。':'走勢大致平穩，關鍵在於當下的選擇。'));
  }else if(S.sp==='five'){
    story='你現時的處境是'+tagName(P[0])+'，面對的挑戰是'+tagName(P[1])+'；牌面建議'+tagName(P[2])+'的做法，外在環境受'+tagName(P[3])+'影響，若依此走下去，結果傾向'+tagName(P[4])+'。';
  }else{
    story='今日的指引牌是'+tagName(P[0])+'：'+CARDS[P[0].ci].kw[P[0].rev?1:0]+'。';
  }
  var revN=P.filter(function(p){return p.rev}).length;
  var revLine=revN?'當中有 '+revN+' 張逆位，通常代表該課題偏向內在、延遲或需要調整的地方。':'全部為正位，能量的表達較直接、順暢。';
  var advCard=S.sp==='three'?P[2]:(S.sp==='five'?P[2]:P[0]);
  var advText=CARDS[advCard.ci].adv[advCard.rev?1:0];
  var scope=S.topic==='all'?'整體':'「'+TOPICS[S.topic]+'」方面';

  var sum='<section class="sum" aria-label="綜合解讀"><p class="lab">Overall</p>'
    +'<h2>'+scope+'：'+v[1]+'</h2>'
    +'<div class="meter" role="img" aria-label="整體傾向：'+v[1]+'"><div class="track"><i style="left:'+pct.toFixed(0)+'%"></i></div><div class="ticks"><span>有阻</span><span>平穩</span><span>順遂</span></div></div>'
    +'<p>'+v[2]+'</p><p>'+story+'</p><p>'+revLine+'</p>'
    +'<p class="advice"><b>建議</b>　'+advText+'</p>'
    +'<p class="note">占卜只是整理思緒的一面鏡子，結果不是定論。決定權始終在你手上。</p></section>';

  var el=$('#reading');
  el.innerHTML=sum+items+'<div class="actions" style="margin-top:8px"><button class="btn primary" id="againBtn" type="button">再占一次</button></div>';
  el.hidden=false;
  $('#againBtn').addEventListener('click',reset);
  later(function(){scrollTo(el)},150);
}
function reset(){
  S.busy=false;S.picks=[];S.flipped=0;
  $('#reading').hidden=true;$('#reading').innerHTML='';
  $('#revealStage').hidden=true;$('#pickStage').hidden=true;
  $('#setup').hidden=false;
  var b=$('#shuffleBtn');b.disabled=false;b.textContent='洗牌';
  $('#deckHint').textContent='按下洗牌前，先在心裡默想你的問題。';
  scrollTo($('#view-read'));
}

/* ---------- gallery ---------- */
var gTopic='all',gIdx=0;
function showDetail(i,doScroll){
  gIdx=i;
  var c=CARDS[i];
  function side(r){
    var tl=gTopic==='all'?'':'<p class="tl"><b>'+TOPICS[gTopic]+'</b>'+c[gTopic][r]+'</p>';
    return '<section><h4>'+(r?'逆位':'正位')+'<span>'+c.kw[r]+'</span></h4><p>'+(r?c.r:c.u)+'</p>'+tl+'<p class="note">建議：'+c.adv[r]+'</p></section>';
  }
  var chips=Object.keys(TOPICS).map(function(k){return '<label class="chip"><input type="radio" name="gt" value="'+k+'"'+(k===gTopic?' checked':'')+'><span>'+TOPICS[k]+'</span></label>'}).join('');
  $('#detail').innerHTML='<div class="dt-card"><div class="card">'+face(i)+'</div></div>'
   +'<div class="dt-body"><p class="eyebrow">'+c.n+' · '+c.en+'</p><h2>'+c.zh+'</h2>'
   +'<p class="art"><b>圖案象徵</b>'+c.art+'</p>'
   +'<div class="chips dtopic" role="group" aria-label="顯示類別">'+chips+'</div>'
   +'<div class="two">'+side(0)+side(1)+'</div></div>';
  document.querySelectorAll('.g').forEach(function(b){b.setAttribute('aria-current',+b.dataset.i===i?'true':'false')});
  if(doScroll)scrollTo($('#detail'));
}
(function(){
  $('#galgrid').innerHTML=CARDS.map(function(c,i){return '<button class="g" type="button" data-i="'+i+'" aria-label="'+c.zh+'"><div class="card">'+face(i)+'</div><span>'+c.n+' '+c.zh+'</span></button>'}).join('');
  showDetail(0,false);
})();

/* ---------- events ---------- */
$('#shuffleBtn').addEventListener('click',startShuffle);
$('#autoBtn').addEventListener('click',autoPick);
$('#backBtn').addEventListener('click',reset);
$('#flipAllBtn').addEventListener('click',flipAll);
$('#pickgrid').addEventListener('click',function(e){var b=e.target.closest('.pick');if(b)pick(+b.dataset.k)});
$('#spread').addEventListener('click',function(e){var b=e.target.closest('.flipbtn');if(b)flip(+b.dataset.i)});
$('#galgrid').addEventListener('click',function(e){var b=e.target.closest('.g');if(b)showDetail(+b.dataset.i,true)});
$('#detail').addEventListener('change',function(e){if(e.target.name==='gt'){gTopic=e.target.value;showDetail(gIdx,false)}});

function tab(t){
  var r=t==='read';
  $('#tab-read').setAttribute('aria-selected',r);$('#tab-gal').setAttribute('aria-selected',!r);
  $('#view-read').hidden=!r;$('#view-gal').hidden=r;
}
$('#tab-read').addEventListener('click',function(){tab('read')});
$('#tab-gal').addEventListener('click',function(){tab('gal')});
})();
</script>

</body></html>
